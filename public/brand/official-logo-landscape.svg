  <circle cx="523" cy="535" r="54" fill="#48583b"/>
  <text x="646" y="615" fill="#201d19" font-family="Georgia, 'Times New Roman', serif" font-size="244" font-weight="500" letter-spacing="0">official</text>
</svg>
